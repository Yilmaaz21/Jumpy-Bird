<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird Studio Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        
        <!-- User Interface Overlay -->
        <div id="ui-layer">
            <div id="score-display">0</div>
            
            <div id="start-screen" class="screen">
                <h1>FLAPPY BIRD</h1>
                <p>Press <strong>SPACE</strong> or <strong>CLICK</strong> to Jump</p>
                <button id="start-btn">PLAY GAME</button>
            </div>

            <div id="game-over-screen" class="screen hidden">
                <h2>GAME OVER</h2>
                <div class="stats-box">
                    <p>Score: <span id="final-score">0</span></p>
                    <p>Best: <span id="best-score">0</span></p>
                </div>
                <button id="restart-btn">RETRY</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
